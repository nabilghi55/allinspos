<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Layanan Sedang Terganggu</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; }
    .box { text-align: center; max-width: 400px; padding: 2rem; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f43f5e; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    button { margin-top: 1rem; padding: 0.6rem 1.2rem; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Koneksi Backend Terputus</h1>
    <p>Server backend POS sedang dalam proses restart atau tidak dapat dijangkau.</p>
    <button onclick="window.location.reload()">Muat Ulang</button>
  </div>
</body>
</html>
