services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allins_pos_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_PATH=/app/data/pos_store.json
    volumes:
      - ./data:/app/data
    networks:
      - allins_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allins_pos_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - allins_net

networks:
  allins_net:
    driver: bridge
